<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexington EMS/Fire Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+e2atLYB3G1JzPp2RgxN6E466+vWXTfFRR92mQf0M="
    crossorigin=""
  />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    /* MENU ICON */
    #menu-icon {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 38px;
      height: 38px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 9999;
      backdrop-filter: blur(4px);
    }

    #menu-icon img {
      width: 22px;
      height: 22px;
      opacity: 0.85;
    }

    /* ARCHIVED ICONS — NOW ACTUALLY WORKS */
    .leaflet-marker-icon.icon-archived {
      filter: grayscale(100%) brightness(70%) !important;
      opacity: 0.55 !important;
    }

    /* Tooltip styling */
    .custom-tooltip {
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>

<body>
  <div id="menu-icon">
    <img src="menu.svg" alt="Menu" />
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o9N1j7kGStpJzP0hZr2dZSmHgwlHGawEq+yLkG4bC2k="
    crossorigin=""
  ></script>

  <!-- YAML Parser -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <!-- Main Script -->
  <script src="lexington.js?v=3.0.1"></script>
</body>
</html>
