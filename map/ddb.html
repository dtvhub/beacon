<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jeffrey’s Live Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #111;
        font-family: Arial, sans-serif;
        color: white;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 50vh 50vh;
        gap: 6px;
        height: 100vh;
    }

    .panel {
        position: relative;
        background: black;
        overflow: hidden;
        border: 2px solid #222;
    }

    .panel video, .panel iframe {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .label {
        position: absolute;
        top: 6px;
        left: 6px;
        background: rgba(0,0,0,0.6);
        padding: 4px 8px;
        font-size: 14px;
        border-radius: 4px;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
function loadStream(videoElementId, streamUrl) {
    const video = document.getElementById(videoElementId);

    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play();
    }
}
</script>
</head>

<body>

    <!-- CNN -->
    <div class="panel" style="grid-column: span 2;">
        <div class="label">CNN</div>
        <video id="cnn" controls muted></video>
    </div>

    <!-- Nicholasville -->
    <div class="panel">
        <div class="label">Nicholasville</div>
        <video id="nich" controls muted></video>
    </div>

    <!-- Weather Channel -->
    <div class="panel">
        <div class="label">Weather Channel</div>
        <video id="weather" controls muted></video>
    </div>

    <!-- Beacon -->
    <div class="panel" style="grid-column: span 2;">
        <div class="label">Beacon</div>
        <iframe src="https://dtvhub.github.io/beacon/map/" frameborder="0"></iframe>
    </div>

<script>
loadStream("cnn", "https://turnerlive.warnermediacdn.com/hls/live/586495/cnngo/cnn_slate/VIDEO_0_3564000.m3u8");
loadStream("nich", "https://video.hazcams.com/nicholasville-ky-us-001/main_stream.m3u8");
loadStream("weather", "https://twcprod-live.twc-tv.com/v1/manifest/b4d4d63a49309cc5140171fb2e92485c31be1e9e/DSP_6228e4760505741a116f1ba2_twcprod-live/6bf09ce5-366b-463c-b67e-c4b799f73c3f/4.m3u8");
</script>

</body>
</html>
